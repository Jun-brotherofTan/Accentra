version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount trained model directory so you can update it without rebuilding
      - ./accent-model:/app/accent-model:ro
    environment:
      - WHISPER_MODEL=base
      - ACCENT_MODEL_PATH=/app/accent-model/model.pt
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
